<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚇 Guangzhou Metro Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="marked.min.js"></script>
  <script>
    window.markedReady = typeof marked !== 'undefined'
      ? Promise.resolve(marked)
      : new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/marked/marked.min.js';
          s.onload = () => window.marked && typeof window.marked.parse === 'function'
            ? resolve(window.marked)
            : reject(new Error('Markdown renderer loaded without a usable parse() function.'));
          s.onerror = () => reject(new Error('Failed to load markdown renderer.'));
          document.head.appendChild(s);
        });
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f7ff;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --shadow: 0 4px 18px rgba(0,0,0,0.13);
      --radius: 20px;
      --header-lang-btn-space: 88px;
      --mobile-header-top-padding: 78px;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    /* ── Animated background sparkles ── */
    .sparkle-bg {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .sparkle-bg span {
      position: absolute;
      display: block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ffd700;
      opacity: 0;
      animation: twinkle 4s infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50%       { opacity: 0.7; transform: scale(1.4); }
    }

    /* ── Page wrapper ── */
    #app { position: relative; z-index: 1; }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1565c0 0%, #283593 60%, #4a148c 100%);
      color: #fff;
      padding: 28px var(--header-lang-btn-space) 20px 24px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      position: relative;
    }
    header .train-emoji { font-size: 3rem; display: block; animation: bounce 2s infinite; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }
    header h1 {
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      font-weight: 900;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      margin: 6px 0 4px;
    }
    header p {
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      opacity: 0.85;
      font-weight: 600;
    }

    /* ── Language toggle ── */
    #lang-btn {
      position: absolute;
      z-index: 10;
      top: 18px; right: 18px;
      background: rgba(255,255,255,0.18);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.55);
      border-radius: 50px;
      padding: 8px 18px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      backdrop-filter: blur(4px);
    }
    #lang-btn:hover { background: rgba(255,255,255,0.32); transform: scale(1.06); }

    /* ── Index view ── */
    #index-view { padding: 28px clamp(12px, 3vw, 20px) 60px; }

    .section-label {
      text-align: center;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #5c6bc0;
      margin: 28px 0 14px;
    }

    .lines-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
      max-width: 960px;
      margin: 0 auto;
    }

    .line-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 18px 10px 16px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      box-shadow: var(--shadow);
      transition: transform 0.18s, box-shadow 0.18s;
      text-align: center;
      line-height: 1.2;
      min-height: 92px;
      min-width: 0;
    }
    .line-btn .btn-emoji { font-size: 1.7rem; }
    .line-btn:hover  { transform: translateY(-5px) scale(1.04); box-shadow: 0 10px 28px rgba(0,0,0,0.2); }
    .line-btn:active { transform: scale(0.97); }

    /* ── Detail view ── */
    #app.detail-open #index-view { display: none; }
    #app.detail-open #detail-view { display: block; }

    #detail-view {
      display: none;
      padding: 28px clamp(12px, 3vw, 20px) 60px;
      min-height: calc(100vh - 120px);
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

    .detail-card {
      max-width: 960px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 12px 48px rgba(0,0,0,0.35);
      animation: slideUp 0.3s ease;
      min-height: calc(100vh - 220px);
    }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }

    .detail-header {
      padding: 22px 24px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .detail-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .detail-header-emoji { font-size: 2rem; }
    .detail-header h2 {
      font-size: clamp(1.2rem, 4vw, 1.7rem);
      font-weight: 900;
      line-height: 1.1;
    }

    .detail-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .nav-btn,
    .icon-btn {
      border: none;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
    }

    .nav-btn {
      min-height: 44px;
      padding: 0 16px;
      border-radius: 999px;
      gap: 8px;
      font-size: 1rem;
      background: rgba(255,255,255,0.25);
    }

    .icon-btn {
      border-radius: 50%;
      width: 44px; height: 44px;
      font-size: 1.3rem;
      background: rgba(255,255,255,0.25);
    }
    .nav-btn:hover,
    .icon-btn:hover { transform: scale(1.06); opacity: 0.9; }

    .detail-body {
      padding: 28px 28px 36px;
      min-height: 320px;
    }

    /* ── Markdown content styles ── */
    .md-content {
      overflow-wrap: break-word;
    }
    .md-content h1 { display: none; } /* title already in header */
    .md-content h2 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #283593;
      margin: 24px 0 10px;
      border-left: 5px solid #ffd700;
      padding-left: 10px;
    }
    .md-content h3 { font-size: 1.05rem; font-weight: 700; margin: 16px 0 6px; }
    .md-content p  { line-height: 1.75; margin: 0 0 12px; font-size: 1.05rem; }
    .md-content ul, .md-content ol { padding-left: 22px; margin: 0 0 12px; }
    .md-content li  { line-height: 1.7; font-size: 1.02rem; margin-bottom: 4px; }
    .md-content blockquote {
      border-left: 5px solid #ffd700;
      background: #fffbea;
      border-radius: 12px;
      padding: 14px 18px;
      margin: 14px 0 18px;
      font-size: 1.05rem;
      color: #555;
    }
    .md-content blockquote p { margin: 0; }
    .md-table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 12px 0 18px;
    }
    .md-content table {
      /* Keep simple tables full-width, but allow wider markdown tables to scroll inside the wrapper. */
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      margin: 0;
      font-size: 1rem;
    }
    .md-content th, .md-content td {
      border: 2px solid #e0e7ff;
      padding: 10px 14px;
      text-align: left;
    }
    .md-content th { background: #e8eaf6; font-weight: 800; }
    .md-content tr:nth-child(even) td { background: #f8f9ff; }
    .md-content code {
      background: #f1f3f4;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 0.95em;
      font-family: monospace;
    }
    .md-content pre {
      background: #1e2a45;
      color: #e0e7ff;
      border-radius: 14px;
      padding: 16px 18px;
      overflow-x: auto;
      margin: 12px 0 18px;
    }
    .md-content pre code { background: none; color: inherit; padding: 0; }
    .md-content strong { font-weight: 800; color: #1a237e; }
    .md-content hr { border: none; border-top: 2px dashed #c5cae9; margin: 20px 0; }

    /* ── Loading spinner ── */
    .loading {
      text-align: center;
      padding: 40px;
      font-size: 2.5rem;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error message ── */
    .error-msg {
      text-align: center;
      padding: 30px;
      color: #c62828;
      font-size: 1.1rem;
      font-weight: 700;
    }

    /* ── Read aloud speaking indicator ── */
    .speaking { animation: pulse 0.8s infinite alternate; }
    @keyframes pulse { from { opacity: 1 } to { opacity: 0.5 } }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 20px;
      color: #9fa8da;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      header {
        padding: var(--mobile-header-top-padding) 18px 18px;
      }
      #lang-btn {
        top: 14px;
        right: 14px;
      }
      .detail-header {
        padding: 18px 18px 14px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .detail-header-left {
        width: 100%;
      }
      .detail-actions {
        width: 100%;
        justify-content: space-between;
      }
      .detail-body {
        padding: 22px 18px 30px;
      }
    }

    @media (max-width: 480px) {
      .lines-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .line-btn {
        min-height: 84px;
        padding: 16px 8px 14px;
        font-size: 0.9rem;
        border-radius: 18px;
      }
      .line-btn .btn-emoji { font-size: 1.5rem; }
      .section-label {
        font-size: 0.92rem;
        margin: 24px 0 12px;
      }
      #index-view {
        padding: 22px 12px 44px;
      }
      #detail-view {
        padding: 12px 10px 24px;
      }
      .detail-card {
        border-radius: 20px;
        min-height: calc(100vh - 170px);
      }
      .detail-header {
        padding: 16px 16px 12px;
      }
      .nav-btn {
        padding: 0 14px;
        font-size: 0.95rem;
      }
      #lang-btn { top: 12px; right: 12px; padding: 6px 12px; font-size: 0.85rem; }
      .detail-body { padding: 18px 16px 28px; }
      footer {
        font-size: 0.8rem;
      }
    }

    @media (max-width: 360px) {
      header h1 {
        font-size: 1.85rem;
      }
      .lines-grid {
        grid-template-columns: 1fr;
      }
      .detail-header h2 {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

<!-- Animated sparkle background -->
<div class="sparkle-bg" id="sparkle-bg" aria-hidden="true"></div>

<div id="app">

  <header>
    <button id="lang-btn" onclick="toggleLang()" aria-label="Toggle language">中文</button>
    <span class="train-emoji">🚇</span>
    <h1 id="header-title">Guangzhou Metro Explorer</h1>
    <p id="header-sub">Learn about all the metro lines! 🌟</p>
  </header>

  <!-- ── Index (line list) ── -->
  <div id="index-view">
    <div class="section-label" id="section-gz">🏙️ Guangzhou Lines</div>
    <div class="lines-grid" id="grid-gz"></div>

    <div class="section-label" id="section-tram">🚋 Trams &amp; Special Lines</div>
    <div class="lines-grid" id="grid-tram"></div>

    <div class="section-label" id="section-fs">🏯 Foshan &amp; Nanhai Lines</div>
    <div class="lines-grid" id="grid-fs"></div>

    <footer id="footer-text">🚇 Tap a line to explore! • Made with ❤️ for curious kids</footer>
  </div>

  <!-- ── Detail page ── -->
  <section id="detail-view" role="region" aria-labelledby="detail-title">
    <div class="detail-card">
      <div class="detail-header" id="detail-header">
        <div class="detail-header-left">
          <span class="detail-header-emoji" id="detail-emoji"></span>
          <h2 id="detail-title"></h2>
        </div>
        <div class="detail-actions">
          <button class="nav-btn" id="back-btn" onclick="goBackFromDetail()" aria-label="Back">
            <span aria-hidden="true">←</span>
            <span id="back-btn-text">Back</span>
          </button>
          <button class="icon-btn" id="speak-btn" onclick="readAloud()" title="Read Aloud" aria-label="Read aloud">🔊</button>
        </div>
      </div>
      <div class="detail-body">
        <div class="md-content" id="content-area"></div>
      </div>
    </div>
  </section>

</div><!-- #app -->

<script>
/* ─────────────────────────────────────────
   DATA
───────────────────────────────────────── */
const lines = [
  // Guangzhou main lines
  { id:'line-1',  nameEn:'Line 1',          nameZh:'1号线',       color:'#F3D03E', emoji:'🟡', group:'gz' },
  { id:'line-2',  nameEn:'Line 2',          nameZh:'2号线',       color:'#0094C8', emoji:'🔵', group:'gz' },
  { id:'line-3',  nameEn:'Line 3',          nameZh:'3号线',       color:'#ECA154', emoji:'🟠', group:'gz' },
  { id:'line-4',  nameEn:'Line 4',          nameZh:'4号线',       color:'#008241', emoji:'🟢', group:'gz' },
  { id:'line-5',  nameEn:'Line 5',          nameZh:'5号线',       color:'#E92B2E', emoji:'🔴', group:'gz' },
  { id:'line-6',  nameEn:'Line 6',          nameZh:'6号线',       color:'#7D337F', emoji:'🟣', group:'gz' },
  { id:'line-7',  nameEn:'Line 7',          nameZh:'7号线',       color:'#97C24A', emoji:'🌿', group:'gz' },
  { id:'line-8',  nameEn:'Line 8',          nameZh:'8号线',       color:'#00A29A', emoji:'💎', group:'gz' },
  { id:'line-9',  nameEn:'Line 9',          nameZh:'9号线',       color:'#86D39B', emoji:'🌱', group:'gz' },
  { id:'line-10', nameEn:'Line 10',         nameZh:'10号线',      color:'#829DC1', emoji:'💙', group:'gz' },
  { id:'line-11', nameEn:'Line 11',         nameZh:'11号线',      color:'#F0A020', emoji:'✨', group:'gz' },
  { id:'line-12', nameEn:'Line 12',         nameZh:'12号线',      color:'#627E2E', emoji:'🌲', group:'gz' },
  { id:'line-13', nameEn:'Line 13',         nameZh:'13号线',      color:'#A4B431', emoji:'🌾', group:'gz' },
  { id:'line-14', nameEn:'Line 14',         nameZh:'14号线',      color:'#843B33', emoji:'🏔️', group:'gz' },
  { id:'line-18', nameEn:'Line 18',         nameZh:'18号线',      color:'#124B9C', emoji:'⚡', group:'gz' },
  { id:'line-21', nameEn:'Line 21',         nameZh:'21号线',      color:'#293A7F', emoji:'🌙', group:'gz' },
  { id:'line-22', nameEn:'Line 22',         nameZh:'22号线',      color:'#C5421C', emoji:'🚀', group:'gz' },
  { id:'line-24', nameEn:'Line 24',         nameZh:'24号线',      color:'#EFE0B1', emoji:'⭐', group:'gz' },
  // Trams & special
  { id:'apm',           nameEn:'APM Line',        nameZh:'APM线',       color:'#00B6DA', emoji:'🤖', group:'tram' },
  { id:'tram-haizhu',   nameEn:'Tram Haizhu',     nameZh:'海珠有轨电车',  color:'#99C349', emoji:'🌸', group:'tram' },
  { id:'tram-huangpu-1',nameEn:'Tram Huangpu 1',  nameZh:'黄埔电车1线',  color:'#E63131', emoji:'🏭', group:'tram' },
  { id:'tram-huangpu-2',nameEn:'Tram Huangpu 2',  nameZh:'黄埔电车2线',  color:'#DBA9C7', emoji:'🌺', group:'tram' },
  // Foshan & Guangfo
  { id:'guangfo',       nameEn:'Guangfo Line',    nameZh:'广佛线',       color:'#B1D234', emoji:'🌉', group:'fs' },
  { id:'foshan-2',      nameEn:'Foshan Line 2',   nameZh:'佛山2号线',    color:'#E02E26', emoji:'🏺', group:'fs' },
  { id:'foshan-3',      nameEn:'Foshan Line 3',   nameZh:'佛山3号线',    color:'#1A1A8E', emoji:'🏯', group:'fs' },
  { id:'nanhai-tram-1', nameEn:'Nanhai Tram 1',   nameZh:'南海有轨电车1线', color:'#8BC9E4', emoji:'🎠', group:'fs' },
];

const ui = {
  en: {
    headerTitle: 'Guangzhou Metro Explorer',
    headerSub:   'Learn about all the metro lines! 🌟',
    sectionGz:   '🏙️ Guangzhou Lines',
    sectionTram: '🚋 Trams & Special Lines',
    sectionFs:   '🏯 Foshan & Nanhai Lines',
    footer:      '🚇 Tap a line to explore! • Made with ❤️ for curious kids',
    langBtn:     '中文',
    detailBack:  'Back',
    stopSpeak:   '⏹️',
    startSpeak:  '🔊',
  },
  zh: {
    headerTitle: '广州地铁小探险家',
    headerSub:   '认识所有地铁线路！🌟',
    sectionGz:   '🏙️ 广州地铁线路',
    sectionTram: '🚋 有轨电车与特色线路',
    sectionFs:   '🏯 佛山与南海线路',
    footer:      '🚇 点击线路开始探索！• 用❤️为好奇的小朋友制作',
    langBtn:     'English',
    detailBack:  '返回',
    stopSpeak:   '⏹️',
    startSpeak:  '🔊',
  }
};

/* ─────────────────────────────────────────
   STATE
───────────────────────────────────────── */
let lang = 'en';
let currentLine = null;
let isSpeaking = false;
let voiceLoadPending = false;  // prevents multiple poll intervals on repeated taps
let activeDetailRequest = 0;

/* ─────────────────────────────────────────
   LUMINANCE HELPER
───────────────────────────────────────── */
function hexLuminance(hex) {
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  const toLinear = c => c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  return 0.2126*toLinear(r) + 0.7152*toLinear(g) + 0.0722*toLinear(b);
}
function textColorFor(hex) {
  return hexLuminance(hex) > 0.35 ? '#1a1a2e' : '#ffffff';
}
function iconBtnBgFor(textColor) {
  const isLight = textColor === '#ffffff';
  return isLight ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.18)';
}

/* ─────────────────────────────────────────
   SPARKLE BACKGROUND
───────────────────────────────────────── */
(function buildSparkles() {
  const bg = document.getElementById('sparkle-bg');
  const colors = ['#ffd700','#ff69b4','#87ceeb','#98fb98','#dda0dd','#ffa07a'];
  for (let i = 0; i < 55; i++) {
    const s = document.createElement('span');
    s.style.cssText = [
      `left:${Math.random()*100}%`,
      `top:${Math.random()*100}%`,
      `animation-delay:${(Math.random()*4).toFixed(2)}s`,
      `animation-duration:${(2.5+Math.random()*3).toFixed(2)}s`,
      `background:${colors[Math.floor(Math.random()*colors.length)]}`,
      `width:${4+Math.random()*5}px`,
      `height:${4+Math.random()*5}px`,
    ].join(';');
    bg.appendChild(s);
  }
})();

/* ─────────────────────────────────────────
   BUILD GRID
───────────────────────────────────────── */
function buildGrids() {
  ['gz','tram','fs'].forEach(group => {
    const grid = document.getElementById('grid-' + group);
    grid.innerHTML = '';
    lines.filter(l => l.group === group).forEach(line => {
      const name = lang === 'en' ? line.nameEn : line.nameZh;
      const fg   = textColorFor(line.color);
      const btn  = document.createElement('button');
      btn.className = 'line-btn';
      btn.setAttribute('aria-label', name);
      btn.style.cssText = `background:${line.color};color:${fg};`;
      btn.innerHTML = `<span class="btn-emoji">${line.emoji}</span><span>${name}</span>`;
      btn.addEventListener('click', () => openLineDetail(line));
      grid.appendChild(btn);
    });
  });
}

function wrapMarkdownTables(root) {
  root.querySelectorAll('table').forEach(table => {
    if (table.closest('.md-table-wrap')) return;
    const wrapper = document.createElement('div');
    wrapper.className = 'md-table-wrap';
    table.parentNode.insertBefore(wrapper, table);
    wrapper.appendChild(table);
  });
}

function getLineById(lineId) {
  return lines.find(line => line.id === lineId) || null;
}

function getCurrentRouteLine() {
  const routeLineId = window.location.hash.replace(/^#/, '').trim();
  return routeLineId ? getLineById(decodeURIComponent(routeLineId)) : null;
}

function updateRoute(line, mode = 'push', options = {}) {
  const url = line ? `#${encodeURIComponent(line.id)}` : `${window.location.pathname}${window.location.search}`;
  const state = {
    lineId: line ? line.id : null,
    fromIndex: Boolean(options.fromIndex),
  };
  if (mode === 'replace') {
    window.history.replaceState(state, '', url);
    return;
  }
  window.history.pushState(state, '', url);
}

function openLineDetail(line) {
  updateRoute(line, 'push', { fromIndex: !currentLine });
  showLine(line);
}

function showIndexView() {
  stopSpeech();
  activeDetailRequest += 1;
  currentLine = null;
  document.getElementById('app').classList.remove('detail-open');
  document.getElementById('content-area').replaceChildren();
}

function syncViewToRoute() {
  const routeLine = getCurrentRouteLine();
  if (!routeLine) {
    showIndexView();
    return;
  }
  showLine(routeLine);
}

function isStaleDetailRequest(requestId, line) {
  return requestId !== activeDetailRequest || currentLine?.id !== line.id;
}

/* ─────────────────────────────────────────
   SHOW LINE DETAIL
───────────────────────────────────────── */
async function showLine(line) {
  const requestId = ++activeDetailRequest;
  currentLine = line;
  stopSpeech();

  // Show page immediately with loading indicator
  const app = document.getElementById('app');
  const header = document.getElementById('detail-header');
  const contentArea = document.getElementById('content-area');
  const emojiEl = document.getElementById('detail-emoji');
  const titleEl = document.getElementById('detail-title');

  const name = lang === 'en' ? line.nameEn : line.nameZh;
  const fg   = textColorFor(line.color);

  header.style.background = line.color;
  header.style.color = fg;
  // Make icon buttons match header
  document.querySelectorAll('.detail-header .icon-btn').forEach(b => {
    b.style.background = iconBtnBgFor(fg);
    b.style.color = fg;
  });
  document.querySelectorAll('.detail-header .nav-btn').forEach(b => {
    b.style.background = iconBtnBgFor(fg);
    b.style.color = fg;
  });

  emojiEl.textContent = line.emoji;
  titleEl.textContent = name;
  contentArea.innerHTML = '<div class="loading">⏳</div>';
  app.classList.add('detail-open');
  window.scrollTo({ top: 0, behavior: 'smooth' });

  try {
    const renderer = await window.markedReady;
    const resp = await fetch(`data/${lang}/${line.id}.md`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const md   = await resp.text();
    if (isStaleDetailRequest(requestId, line)) return;
    contentArea.innerHTML = renderer.parse(md);
    wrapMarkdownTables(contentArea);
  } catch (e) {
    if (isStaleDetailRequest(requestId, line)) return;
    const errorMsg = e instanceof Error ? e.message : String(e);
    const errorBox = document.createElement('div');
    const detailMsg = document.createElement('small');
    errorBox.className = 'error-msg';
    errorBox.textContent = `😢 Couldn't load content.`;
    errorBox.appendChild(document.createElement('br'));
    detailMsg.textContent = errorMsg;
    errorBox.appendChild(detailMsg);
    contentArea.replaceChildren(errorBox);
  }
}

function goBackFromDetail() {
  if (window.history.state?.fromIndex) {
    window.history.back();
    return;
  }
  updateRoute(null, 'replace');
  showIndexView();
}

window.addEventListener('popstate', syncViewToRoute);

/* ─────────────────────────────────────────
   LANGUAGE TOGGLE
───────────────────────────────────────── */
function toggleLang() {
  lang = lang === 'en' ? 'zh' : 'en';
  applyLangUI();
  buildGrids();
  // If detail panel is open, reload content in new language
  if (currentLine) showLine(currentLine);
}

function applyLangUI() {
  const t = ui[lang];
  document.getElementById('header-title').textContent = t.headerTitle;
  document.getElementById('header-sub').textContent   = t.headerSub;
  document.getElementById('section-gz').textContent   = t.sectionGz;
  document.getElementById('section-tram').innerHTML   = t.sectionTram;
  document.getElementById('section-fs').textContent   = t.sectionFs;
  document.getElementById('footer-text').innerHTML    = t.footer;
  document.getElementById('lang-btn').textContent     = t.langBtn;
  document.getElementById('back-btn-text').textContent = t.detailBack;
  document.getElementById('back-btn').setAttribute('aria-label', t.detailBack);
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
}

/* ─────────────────────────────────────────
   READ ALOUD
───────────────────────────────────────── */

/**
 * Pick the best available voice for the given BCP-47 language tag.
 * Preference order: neural/natural/enhanced voices first, then any
 * voice that matches the language, finally the browser default.
 */
function pickBestVoice(langTag) {
  const voices = window.speechSynthesis.getVoices();
  const tag = langTag.toLowerCase();

  // Score a voice: higher = better quality
  function score(v) {
    const name = v.name.toLowerCase();
    const uri  = (v.voiceURI || '').toLowerCase();
    // Exact locale match (e.g. en-US) scores higher than same-language (e.g. en-GB)
    const langMatch = v.lang.toLowerCase() === tag ? 4
                    : v.lang.toLowerCase().startsWith(tag.slice(0, 2)) ? 2 : 0;
    // Prefer neural / natural / enhanced / premium voices.
    // "siri" catches "Siri Voice 1/2" on devices where Apple exposes them.
    // Also check voiceURI for Apple's "-premium" bundle (e.g. com.apple.ttsbundle.Tingting-premium)
    // which surfaces on iOS/iPadOS/macOS Safari where the display name may not include "Enhanced".
    const quality = /neural|natural|enhanced|premium|wavenet|studio|siri/.test(name) ||
                    /premium|siri/.test(uri) ? 4 : 0;
    // Well-known high-quality providers: Google / Microsoft by name;
    // Apple by voiceURI prefix (com.apple) on Safari / iOS / macOS.
    const provider = /google|microsoft/.test(name) ||
                     /com\.apple/.test(uri) ? 1 : 0;
    return langMatch + quality + provider;
  }

  const matching = voices.filter(v =>
    v.lang.toLowerCase().startsWith(tag.slice(0, 2))
  );

  if (matching.length === 0) return null;
  matching.sort((a, b) => score(b) - score(a));
  return matching[0];
}

/**
 * Strip Markdown-style symbols so the synthesiser reads the prose,
 * not the markup characters (headings, bold, italic, bullets, etc.).
 */
function cleanTextForSpeech(raw) {
  return raw
    .replace(/^\s*#{1,6}\s*/gm, '')               // headings: ### Title → Title
    .replace(/\*{1,3}([^*]+)\*{1,3}/g, '$1')      // **bold** / *italic*
    .replace(/_{1,2}([^_]+)_{1,2}/g, '$1')        // __bold__ / _italic_
    .replace(/`{3}[\s\S]*?`{3}/g, '')             // fenced code blocks (multiline)
    .replace(/`[^`]*`/g, '')                      // inline code
    .replace(/^\s*[-*+]\s+/gm, '')                // unordered list bullets
    .replace(/^\s*\d+\.\s+/gm, '')                // ordered list numbers
    .replace(/!\[([^\]]*)\]\([^)]+\)/g, '$1')     // images: ![alt](url) → alt
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')      // links: [text](url) → text
    .replace(/[-─_]{2,}/g, ', ')                  // horizontal rules / dashes
    .replace(/\s{2,}/g, ' ')                      // collapse extra whitespace
    .trim();
}

function stopSpeech() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  isSpeaking = false;
  const btn = document.getElementById('speak-btn');
  if (btn) btn.classList.remove('speaking');
  btn && (btn.textContent = ui[lang].startSpeak);
}

function _doSpeak(text) {
  const langTag = lang === 'zh' ? 'zh-CN' : 'en-US';
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = langTag;
  utterance.rate = 0.92;
  utterance.pitch = 1.0;

  const voice = pickBestVoice(langTag);
  if (voice) utterance.voice = voice;

  utterance.onstart = () => {
    isSpeaking = true;
    const btn = document.getElementById('speak-btn');
    btn && btn.classList.add('speaking');
    btn && (btn.textContent = ui[lang].stopSpeak);
  };
  utterance.onend = utterance.onerror = () => stopSpeech();

  window.speechSynthesis.speak(utterance);
}

function readAloud() {
  if (!window.speechSynthesis) {
    alert('Sorry, your browser does not support Read Aloud 😢');
    return;
  }
  if (isSpeaking) { stopSpeech(); return; }

  const raw = document.getElementById('content-area').innerText;
  if (!raw) return;

  const text = cleanTextForSpeech(raw);
  if (!text || text.length < 5) return;

  // Voices may not be loaded yet (async in Chrome); wait if needed.
  // onvoiceschanged is unreliable on iOS Safari (may never fire), so
  // also poll every 100 ms as a fallback and give up after ~2 s (20 × 100 ms).
  // voiceLoadPending prevents multiple polling intervals if the button is
  // tapped repeatedly before voices finish loading.
  // A shared `fired` flag prevents _doSpeak being called twice if both
  // the event and the polling interval fire in the same tick.
  const voices = window.speechSynthesis.getVoices();
  if (voices.length === 0) {
    if (voiceLoadPending) return;
    voiceLoadPending = true;
    let fired = false;
    let retries = 0;
    const startSpeak = () => {
      if (fired) return;
      fired = true;
      voiceLoadPending = false;
      clearInterval(poll);
      window.speechSynthesis.onvoiceschanged = null;
      _doSpeak(text);
    };
    const poll = setInterval(() => {
      // When voices load OR after the timeout, call startSpeak.
      // On timeout (retries >= 20) voices may still be empty; _doSpeak handles
      // that gracefully — pickBestVoice returns null and the browser uses its default.
      if (window.speechSynthesis.getVoices().length > 0 || retries++ >= 20) startSpeak();
    }, 100);
    window.speechSynthesis.onvoiceschanged = startSpeak;
  } else {
    _doSpeak(text);
  }
}

/* ─────────────────────────────────────────
   INIT
───────────────────────────────────────── */
applyLangUI();
buildGrids();
updateRoute(getCurrentRouteLine(), 'replace');
syncViewToRoute();
</script>
